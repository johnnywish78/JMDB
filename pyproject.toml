[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jmdb"
version = "1.0.0"
description = "Johnny Media Database — a personal media center (PyQt6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.5",
    "requests>=2.28",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
backends = ["python-vlc>=3.0", "python-mpv>=1.0"]
browser = ["PyQt6-WebEngine>=6.5"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.1"]

[project.scripts]
jmdb = "app.bootstrap.startup:run"

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
