<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://127.0.0.1 http://127.0.0.1 ws://localhost http://localhost; font-src 'self' data:">
  <title>JMDB</title>
  <link rel="icon" href="/app/assets/icon.png">
  <link rel="stylesheet" href="/app/css/app.css">
</head>
<body>
  <div id="app" class="app">
    <aside id="sidebar" class="sidebar">
      <a class="brand" href="#/home">
        <img class="brand-logo" src="/app/assets/icon.png" alt="">
        <span class="brand-name">JMDB</span>
      </a>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div id="scan-pill" class="scan-pill hidden" title="Library scan">
          <span class="scan-spinner"></span>
          <span id="scan-pill-text">Scanning…</span>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="searchbox">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="global-search" type="search" placeholder="Search movies, shows, people, music…  (Ctrl+K)"
                 autocomplete="off" spellcheck="false">
        </div>
        <div class="topbar-actions">
          <button id="btn-scan" class="ghost-btn" title="Scan library">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button id="btn-theme" class="ghost-btn" title="Toggle theme">
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <main id="page" class="page" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="player-root"></div>

  <script type="module" src="/app/js/app.js"></script>
</body>
</html>
